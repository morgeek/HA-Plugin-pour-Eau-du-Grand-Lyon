# Configuration mypy — volontairement permissive.
# Home Assistant n'étant pas installé dans le job de typage, ses imports sont
# résolus en Any (ignore_missing_imports). Le durcissement progressif vers le
# critère Platinum `strict-typing` reste à faire ; le job CI mypy est donc NON
# bloquant (continue-on-error) — il fournit un retour sans casser le build.
#
# NB : le layout `custom_components/` (namespace sans __init__) déclenche selon
# les versions de mypy l'avertissement « Source file found twice » ; il est sans
# impact fonctionnel et le job reste non bloquant.
[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = False
warn_return_any = False
