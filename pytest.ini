[pytest]
# `tests/` simule Home Assistant ; `tests_ha/` exige un vrai Home Assistant
# (pytest-homeassistant-custom-component) et se lance explicitement :
#   pytest tests_ha
testpaths = tests
# pytest-asyncio : les tests `async def` ne portent pas de marqueur explicite,
# le mode "auto" les prend donc en charge automatiquement (rétabli après la
# suppression de pyproject.toml qui portait cette configuration).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
