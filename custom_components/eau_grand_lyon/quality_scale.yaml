rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: todo
    comment: >-
      Les fichiers locaux icon.png et logo.png mesurent 220x68 et ne satisfont
      pas les dimensions officielles. Aucun asset carré autorisé ni publication
      vérifiée dans home-assistant/brands n'est disponible.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-triggers:
    status: done
    comment: L'intégration ne fournit aucun déclencheur personnalisé à documenter.
  docs-conditions:
    status: done
    comment: L'intégration ne fournit aucune condition personnalisée à documenter.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      Les retries attendus restent en DEBUG. Le coordinator journalise une seule
      transition healthy -> offline et une seule reprise offline -> healthy ;
      les cycles toujours hors ligne ne répètent pas le WARNING.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: >-
      La CI exige une couverture globale d'au moins 95 % et vérifie en plus que
      chaque module Python non vide de l'intégration dépasse strictement 95 %.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Cloud-polling integration; no local discovery.
  discovery:
    status: exempt
    comment: Cloud-polling integration; no local discovery.
  docs-data-update: done
  docs-examples:
    status: todo
    comment: >-
      Le dépôt fournit quatre Blueprints et des exemples YAML dans le README,
      mais la règle officielle demande la publication d'un ensemble limité dans
      home-assistant.io ou sur Blueprint Exchange, puis un lien depuis la page
      officielle de l'intégration. Ce travail upstream reste à effectuer.
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: >-
      Sensor et binary_sensor écoutent le coordinator et ajoutent uniquement les
      unique_id encore inconnus lorsqu'un contrat apparaît après le setup. Une
      disparition ne supprime aucune entité ni aucun historique ; une réapparition
      ne crée pas de doublon.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations:
    status: done
    comment: >-
      Noms traduits (has_entity_name + translation_key) et états enum traduits
      (santé, sécheresse, compatibilité, éco-score en device_class ENUM +
      section state). Le capteur coaching reste un texte libre (contenu, non
      énumérable).
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: done
    comment: >-
      async_remove_config_entry_device autorise la suppression des devices
      dont le contrat a disparu de l'API ; l'historique mensuel des contrats
      disparus est purgé à chaque cycle.

  # Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: >-
      Les cookies OAuth sont isolés dans une session dédiée créée avec
      async_create_clientsession et un CookieJar sécurisé par défaut.
  strict-typing:
    status: done
    comment: >-
      Les données normalisées utilisent des TypedDict dédiés, ConfigEntry et
      DataUpdateCoordinator sont paramétrés, et la CI exécute mypy strict avec
      Home Assistant 2026.8.1 réellement installé sous Python 3.14.
