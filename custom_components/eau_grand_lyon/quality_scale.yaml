rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: exempt
    comment: >-
      Intégration en dépôt personnalisé (HACS custom) : les icônes sont
      fournies via le dossier brand/ local. La soumission à home-assistant/brands
      n'est requise que pour le store par défaut, pas pour un install custom
      (validation HACS lancée avec ignore: brands).
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Cloud-polling integration; no local discovery.
  discovery:
    status: exempt
    comment: Cloud-polling integration; no local discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Devices = water meters under one account; cardinality fixed by API.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations:
    status: done
    comment: >-
      Noms traduits (has_entity_name + translation_key) et états enum traduits
      (santé, sécheresse, compatibilité, éco-score en device_class ENUM +
      section state). Le capteur coaching reste un texte libre (contenu, non
      énumérable).
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: done
    comment: >-
      async_remove_config_entry_device autorise la suppression des devices
      dont le contrat a disparu de l'API ; l'historique mensuel des contrats
      disparus est purgé à chaque cycle.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: Provider requires CookieJar(unsafe=True) for OAuth cookie; a dedicated session is created and closed with the entry.
  strict-typing:
    status: todo
    comment: >-
      Un job CI mypy (non bloquant) est en place ; le durcissement complet vers
      le typage strict reste à faire.
