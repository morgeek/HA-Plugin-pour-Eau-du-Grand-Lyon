rules:
  # Bronze
  action-setup:
    status: todo
    comment: >-
      Les services sont enregistrés dans async_setup_entry, pas dans
      async_setup. À déplacer pour qu'un appel échoue proprement quand
      l'entrée n'est pas chargée.
  appropriate-polling: done
  brands:
    status: todo
    comment: >-
      Le domaine n'est pas encore fusionné dans home-assistant/brands
      (validation HACS lancée avec ignore: brands). Dossier brand/ local
      uniquement.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Cloud-polling integration; no local discovery.
  discovery:
    status: exempt
    comment: Cloud-polling integration; no local discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Devices = water meters under one account; cardinality fixed by API.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations:
    status: todo
    comment: >-
      Les noms d'entités sont traduits, mais plusieurs états sont encore
      codés en dur en français (santé OK/KO, sécheresse, coaching) sans
      device_class ENUM + states de traduction.
  exception-translations:
    status: todo
    comment: >-
      La section exceptions de strings.json existe mais n'est reliée à aucun
      translation_key dans le code ; les exceptions sont levées en dur.
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: todo
    comment: >-
      Aucun retrait des devices/entités orphelins quand un contrat disparaît
      de l'API — un contrat clôturé laisse son device en place.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: Provider requires CookieJar(unsafe=True) for OAuth cookie; a dedicated session is created and closed with the entry.
  strict-typing: todo
