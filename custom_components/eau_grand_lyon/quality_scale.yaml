rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: todo
    comment: >-
      Les icônes locales satisfont l'affichage HACS, mais la règle officielle
      exige aussi leur publication dans home-assistant/brands et n'admet aucune
      exemption.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-triggers:
    status: done
    comment: L'intégration ne fournit aucun déclencheur personnalisé à documenter.
  docs-conditions:
    status: done
    comment: L'intégration ne fournit aucune condition personnalisée à documenter.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: >-
      Couverture globale portée d'environ 64 % à 77 % dans la version 3.4.6,
      mais plusieurs modules restent sous le seuil requis de 95 %.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Cloud-polling integration; no local discovery.
  discovery:
    status: exempt
    comment: Cloud-polling integration; no local discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: todo
    comment: >-
      Les contrats d'un compte peuvent changer après le setup. Les plateformes
      ne créent pas encore automatiquement les entités d'un nouveau contrat.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations:
    status: done
    comment: >-
      Noms traduits (has_entity_name + translation_key) et états enum traduits
      (santé, sécheresse, compatibilité, éco-score en device_class ENUM +
      section state). Le capteur coaching reste un texte libre (contenu, non
      énumérable).
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: done
    comment: >-
      async_remove_config_entry_device autorise la suppression des devices
      dont le contrat a disparu de l'API ; l'historique mensuel des contrats
      disparus est purgé à chaque cycle.

  # Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: >-
      Les cookies OAuth sont isolés dans une session dédiée créée avec
      async_create_clientsession et un CookieJar sécurisé par défaut.
  strict-typing:
    status: todo
    comment: >-
      Le job CI mypy est bloquant et passe avec une configuration progressive ;
      le typage strict complet de tous les modules reste à faire.
