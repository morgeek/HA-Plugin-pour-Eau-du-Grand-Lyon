blueprint:
  name: "🌵 Eau Grand Lyon — Alerte Niveau Sécheresse"
  description: >
    Envoie une notification quand l'indicateur saisonnier local passe en
    vigilance. Cet indicateur est une heuristique calendaire et ne reflète pas
    les arrêtés préfectoraux ni les restrictions réellement en vigueur.
  domain: automation
  source_url: https://github.com/morgeek/HA-Plugin-pour-Eau-du-Grand-Lyon/blob/main/blueprints/automation/eau_grand_lyon/alerte_secheresse.yaml
  homeassistant:
    min_version: 2024.11.0
  input:
    sensor_secheresse:
      name: Capteur Niveau de Sécheresse
      description: >
        Sélectionnez le sensor "Niveau de sécheresse" de l'intégration
        Eau du Grand Lyon.
      selector:
        entity:
          integration: eau_grand_lyon
          domain: sensor
    niveaux_alertes:
      name: Niveaux déclenchant une notification
      description: "Sélectionnez les niveaux qui doivent envoyer une alerte"
      default:
        - "vigilance"
      selector:
        select:
          multiple: true
          options:
            - label: "Vigilance"
              value: "vigilance"
            - label: "Crise"
              value: "crise"
    service_notification:
      name: Service de notification
      description: "Nom du service de notification (ex: notify.mobile_app_iphone)"
      selector:
        select:
          custom_value: true
          options: []

variables:
  sensor_entity: !input sensor_secheresse
  niveau_actuel: "{{ states(sensor_entity) }}"
  niveaux: !input niveaux_alertes

trigger:
  - platform: state
    entity_id: !input sensor_secheresse

condition:
  - condition: template
    value_template: "{{ niveau_actuel in niveaux }}"
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.from_state.state != trigger.to_state.state }}

action:
  - service: !input service_notification
    data:
      title: "🌵 Alerte Sécheresse — {{ niveau_actuel }}"
      message: >
        Le niveau de sécheresse dans votre zone vient de passer à **{{ niveau_actuel }}**.

        ⚠️ Des restrictions d'usage de l'eau peuvent s'appliquer :
        - 🚫 Arrosage de jardins (heures creuses ou interdit)
        - 🚫 Lavage de véhicules
        - 🚫 Remplissage de piscines

        Vérifiez les restrictions réellement en vigueur sur VigiEau ou sur le
        site de la préfecture du Rhône.

        💡 Pensez à réduire votre consommation pour préserver la ressource.
      data:
        tag: eau_grand_lyon_secheresse
        actions:
          - action: URI
            title: "📋 Vérifier sur VigiEau"
            uri: https://vigieau.gouv.fr
          - action: URI
            title: "🌐 Espace client"
            uri: https://agence.eaudugrandlyon.com

mode: single
max_exceeded: silent
