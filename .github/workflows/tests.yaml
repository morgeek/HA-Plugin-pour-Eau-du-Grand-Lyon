name: Tests & Validation

on:
  push:
    branches: [main, DEV]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  tests:
    name: Tests Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Home Assistant 2024.11+ only runs on Python 3.12+
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: ".github/workflows/tests.yaml"

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov voluptuous flake8 black

      - name: Lint with flake8
        run: |
          flake8 custom_components/eau_grand_lyon/ --max-line-length=120 --extend-ignore=E203,W503 --count --show-source

      - name: Format check with black
        run: |
          black --check custom_components/eau_grand_lyon/ tests/ scripts/ --line-length=120

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=custom_components/eau_grand_lyon \
            --cov-report=term-missing \
            --cov-report=json \
            --cov-fail-under=95
          python scripts/check_module_coverage.py coverage.json

  ha-config-flow-compat:
    name: ConfigFlow HA ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.12"
            homeassistant: "2024.11.0"
            expect-modern: "no"
          - python-version: "3.13"
            homeassistant: "2025.12.5"
            expect-modern: "yes"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: .github/workflows/tests.yaml

      - name: Install real Home Assistant
        run: |
          if [[ "${{ matrix.homeassistant }}" == "2024.11.0" ]]; then
            # The old hass-nabucasa/acme metadata allows josepy 2.x, whose
            # ComparableX509 removal now breaks imports. Restore the compatible
            # dependency range used by this historical HA release.
            pip install "homeassistant==${{ matrix.homeassistant }}" "josepy<2"
          else
            pip install "homeassistant==${{ matrix.homeassistant }}"
          fi

      - name: Exercise inherited ConfigFlow compatibility path
        run: python scripts/ha_config_flow_smoke.py --expect-modern "${{ matrix.expect-modern }}"

  typing:
    name: Typage (mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install mypy==1.17.1 voluptuous

      - name: Run mypy
        run: mypy custom_components/eau_grand_lyon/

  validate:
    name: Validation HA (hassfest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: Validation HACS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run HACS Action
        uses: hacs/action@main
        with:
          category: integration
          # 'brands' requires the domain to be merged into home-assistant/brands,
          # which is only needed for the official HACS default store, not for
          # custom-repository installs. Ignore it until the brands PR is merged.
          ignore: brands
