# Configuration mypy progressive : le package Home Assistant n'est pas installé
# dans le job dédié, mais la résolution du namespace custom_components reste
# déterministe et toute erreur analysée fait échouer la CI.
[mypy]
python_version = 3.12
namespace_packages = False
ignore_missing_imports = True
follow_imports = normal
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = False
warn_return_any = False
