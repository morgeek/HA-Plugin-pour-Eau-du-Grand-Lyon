clear_cache:
  name: Effacer le cache local
  description: >
    Supprime le cache persistant (historique et consommations enregistrées)
    et réinitialise les capteurs.

update_now:
  name: Mettre à jour maintenant
  description: >
    Force une synchronisation immédiate avec les serveurs Eau du Grand Lyon,
    en ignorant l'intervalle de mise à jour configuré.

export_data:
  name: Exporter les données
  description: >
    Exporte l'historique des consommations (mensuelles et journalières)
    vers un fichier CSV local.
  fields:
    path:
      name: Chemin du fichier
      description: Chemin complet du fichier CSV.
      example: "/config/exports/ma_conso_eau.csv"
      default: "/config/exports/eau_grand_lyon_history.csv"
      selector:
        text:

download_latest_invoice:
  name: Télécharger la dernière facture
  description: >
    Télécharge le duplicata PDF de la facture la plus récente que le portail
    rend téléchargeable et l'enregistre localement. Si un contrat est spécifié,
    télécharge sa facture.
  fields:
    path:
      name: Chemin de destination
      description: Chemin complet du fichier PDF.
      example: "/config/www/eau_grand_lyon/derniere_facture.pdf"
      default: "/config/www/eau_grand_lyon/latest_invoice.pdf"
      selector:
        text:
    contract_reference:
      name: Référence du contrat
      description: Numéro de contrat spécifique. Si absent, utilise le premier contrat avec factures.
      example: "AB1234567890"
      required: false
      selector:
        text:
